<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Der rote Faden – Redaktion</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --red: #9e2e22; --red-dark: #7f2219; --ink: #1c1208; --mid: #6a5a46; --bg: #f5f1ea; --line: #ddd0be; --ok: #3f6b3a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Hinscrollen und Fokus landen nicht unter Kopf- und Speicherleiste. */
  html { scroll-padding: 130px 0 90px; }
  body { font-family: 'Inter', -apple-system, sans-serif; font-size: 16px; line-height: 1.6; color: var(--ink); background: var(--bg); }
  h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 500; }
  a { color: var(--red); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }
  .hidden { display: none !important; }

  header.bar { position: sticky; top: 0; z-index: 20; background: #fdfcf8; border-bottom: 1px solid var(--line); }
  .bar-in { display: flex; align-items: center; gap: 10px; padding: 12px 0 8px; flex-wrap: wrap; }
  .bar-in h1 { font-size: 24px; margin-right: auto; }
  nav.tabs { display: flex; gap: 4px; padding-bottom: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  nav.tabs button { font: 500 15px 'Inter', sans-serif; padding: 7px 13px; border-radius: 7px; border: 0; background: transparent; color: var(--mid); cursor: pointer; white-space: nowrap; }
  nav.tabs button.active { background: var(--red); color: #fff; }

  .btn { font: 600 15px 'Inter', sans-serif; padding: 10px 18px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--red-dark); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--mid); }
  .btn-small { font-size: 14px; padding: 7px 12px; }
  .btn-danger { color: var(--red); border-color: #d9b3a8; background: #fff; }

  main.wrap { padding: 22px 20px 130px; }
  .panel { background: #fdfcf8; border: 1px solid var(--line); border-radius: 10px; padding: 24px; margin-bottom: 18px; }
  .panel > h2 { font-size: 26px; line-height: 1.2; margin-bottom: 2px; }
  .panel > .sub { font-size: 14.5px; color: var(--mid); margin-bottom: 18px; }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 5px; }
  label { display: block; font-weight: 600; font-size: 14.5px; }
  .restore { font: 500 13px 'Inter', sans-serif; color: var(--red); background: none; border: 0; cursor: pointer; text-decoration: underline; white-space: nowrap; padding: 0; }
  .hint { font-size: 13px; color: var(--mid); margin-top: 4px; }
  input[type=text], input[type=password], textarea {
    width: 100%; font: 400 16px 'Inter', sans-serif; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 7px; background: #fff; color: var(--ink);
  }
  textarea { line-height: 1.55; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--red); }
  .changed input, .changed textarea { border-left: 3px solid var(--red); }
  .list-row { display: flex; gap: 8px; margin-bottom: 8px; }

  .fmt-help { background: #f7ece4; border: 1px solid #e8d3c4; border-radius: 8px; padding: 10px 14px; font-size: 14px; color: #6e3f2b; margin-bottom: 18px; }
  .fmt-help code { font: 13px ui-monospace, Menlo, monospace; background: #fff; border: 1px solid #e8d3c4; border-radius: 4px; padding: 1px 5px; white-space: nowrap; }

  .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .img-card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; background: #fff; }
  .img-card .thumb { aspect-ratio: 4 / 3; background: var(--bg); }
  .img-card .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .img-card .body { padding: 13px 15px 15px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .img-card h3 { font-size: 21px; line-height: 1.2; }
  .img-card .note { flex: 1; }
  .img-card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .img-card input[type=file] { display: none; }

  .msg { border-radius: 8px; padding: 12px 15px; margin-bottom: 16px; font-size: 15px; font-weight: 500; }
  .msg-error { background: #f8e4df; color: var(--red-dark); border: 1px solid #e6bfb4; }
  .msg-ok { background: #e8f0e4; color: var(--ok); border: 1px solid #c5d8bd; }

  .savebar { position: fixed; left: 0; right: 0; bottom: 0; background: #fdfcf8; border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(28,18,8,.07); z-index: 30; }
  .savebar-in { display: flex; align-items: center; gap: 10px; padding: 12px 20px; flex-wrap: wrap; justify-content: flex-end; }
  .status { font-size: 14px; color: var(--mid); margin-right: auto; }
  .status.dirty { color: var(--red); font-weight: 600; }
  .status.saved { color: var(--ok); font-weight: 600; }

  .login-box { max-width: 420px; margin: 12vh auto; background: #fdfcf8; border: 1px solid var(--line); border-radius: 10px; padding: 32px; }
  .login-box h2 { font-size: 30px; line-height: 1.2; margin-bottom: 4px; }
  .login-box .sub { color: var(--mid); font-size: 14.5px; margin-bottom: 20px; }
  @media (max-width: 600px) { .panel { padding: 18px; } .login-box { margin: 6vh 16px; padding: 24px; } }
</style>
</head>
<body>

<section id="login-view" class="hidden">
  <div class="login-box">
    <h2>Der rote Faden – Redaktion</h2>
    <p class="sub">Hier bearbeitest du die Texte und Fotos deiner Website.</p>
    <div id="login-msg" class="msg msg-error hidden"></div>
    <form id="login-form">
      <div class="field">
        <label for="pw" style="margin-bottom:5px">Passwort</label>
        <input id="pw" type="password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit" id="login-btn">Anmelden</button>
    </form>
  </div>
</section>

<div id="app-view" class="hidden">
  <header class="bar">
    <div class="wrap">
      <div class="bar-in">
        <h1>Redaktion</h1>
        <a class="btn btn-ghost btn-small" href="/" target="_blank" rel="noopener">Website ansehen ↗</a>
        <button class="btn btn-ghost btn-small" id="logout-btn">Abmelden</button>
      </div>
      <nav class="tabs" id="tabs"></nav>
    </div>
  </header>
  <main class="wrap">
    <div id="app-msg" class="msg hidden"></div>
    <div id="panels"></div>
  </main>
  <div class="savebar">
    <div class="wrap savebar-in">
      <span class="status" id="save-status">Alles gespeichert</span>
      <button class="btn btn-ghost btn-small" id="revert-btn">Verwerfen</button>
      <button class="btn btn-primary" id="save-btn" disabled>Speichern</button>
    </div>
  </div>
</div>

<script src="/cms.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid) n.append(kid);
    return n;
  };
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  // content: Carolinas Änderungen { texts, images }, nur Abweichungen vom Original.
  // defaults: die Originale, direkt aus dem HTML der Website gelesen.
  const state = { content: null, saved: null, defaults: null, schema: null, tab: "start", dirty: false, busy: false };

  async function api(path, opts = {}) {
    const res = await fetch(path, { credentials: "same-origin", ...opts });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (res.status === 401 && !path.endsWith("/login") && !path.endsWith("/password")) {
      showLogin("Die Sitzung ist abgelaufen. Bitte neu anmelden.");
    }
    if (!res.ok || !data || data.ok === false) throw new Error((data && data.error) || "Fehler " + res.status);
    return data;
  }

  function message(text, kind = "ok") {
    const box = $("app-msg");
    box.textContent = text;
    box.className = "msg " + (kind === "ok" ? "msg-ok" : "msg-error");
    clearTimeout(message.t);
    message.t = setTimeout(() => box.classList.add("hidden"), kind === "ok" ? 4000 : 9000);
  }

  function markDirty() {
    state.dirty = !same(state.content, state.saved);
    const s = $("save-status");
    s.textContent = state.dirty ? "Nicht gespeichert" : "Alles gespeichert";
    s.className = "status" + (state.dirty ? " dirty" : " saved");
    $("save-btn").disabled = !state.dirty || state.busy;
    $("revert-btn").classList.toggle("hidden", !state.dirty);
  }
  window.addEventListener("beforeunload", (e) => { if (state.dirty) { e.preventDefault(); e.returnValue = ""; } });

  async function save() {
    if (state.busy) return;
    state.busy = true; $("save-btn").disabled = true; $("save-btn").textContent = "Speichert …";
    try {
      const d = await api("/api/admin/content", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: state.content }),
      });
      state.content = d.content;
      state.saved = clone(d.content);
      render();
      message("Gespeichert. Die Website zeigt die Änderungen sofort.");
    } catch (err) {
      message("Speichern fehlgeschlagen: " + err.message, "error");
    } finally {
      state.busy = false; $("save-btn").textContent = "Speichern"; markDirty();
    }
  }

  // ------------------------------------------------------------- Felder ---
  const current = (key) => key in state.content.texts ? state.content.texts[key] : state.defaults.texts[key];
  function setValue(key, value) {
    if (same(value, state.defaults.texts[key])) delete state.content.texts[key];
    else state.content.texts[key] = value;
    markDirty();
  }

  function fieldShell(field, control, rerender) {
    const box = el("div", { class: "field" });
    const head = el("div", { class: "field-head" }, el("label", { for: "f-" + field.key }, field.label));
    const restore = el("button", { class: "restore", type: "button", onclick: () => { setValue(field.key, state.defaults.texts[field.key]); rerender(); } }, "Original");
    head.append(restore);
    const sync = () => {
      const changed = field.key in state.content.texts;
      restore.classList.toggle("hidden", !changed);
      box.classList.toggle("changed", changed);
    };
    sync();
    box.append(head, control);
    if (field.hint) box.append(el("div", { class: "hint" }, field.hint));
    box.sync = sync;
    return box;
  }

  function textField(field) {
    const value = current(field.key) ?? "";
    let input;
    if (field.type === "line") {
      input = el("input", { type: "text", id: "f-" + field.key });
    } else {
      const rows = field.type === "block" ? 24 : Math.min(12, Math.ceil(value.length / 62) + value.split("\n").length);
      input = el("textarea", { id: "f-" + field.key, rows });
    }
    input.value = value;
    const box = fieldShell(field, input, () => { input.value = current(field.key) ?? ""; box.sync(); });
    input.addEventListener("input", () => { setValue(field.key, input.value); box.sync(); });
    return box;
  }

  function listField(field) {
    const rows = el("div", {});
    const box = fieldShell(field, rows, () => build());
    const edit = (fn) => {
      const items = clone(current(field.key));
      fn(items);
      setValue(field.key, items);
      box.sync();
    };
    function build() {
      rows.innerHTML = "";
      box.sync();
      current(field.key).forEach((item, i) => {
        const input = el("input", { type: "text", "aria-label": field.label + " " + (i + 1) });
        input.value = item;
        input.addEventListener("input", () => edit((items) => { items[i] = input.value; }));
        rows.append(el("div", { class: "list-row" }, input,
          el("button", { class: "btn btn-danger btn-small", type: "button", "aria-label": "Punkt löschen",
            onclick: () => { edit((items) => items.splice(i, 1)); build(); } }, "×")));
      });
      rows.append(el("button", { class: "btn btn-ghost btn-small", type: "button",
        onclick: () => { edit((items) => items.push("Neuer Punkt")); build(); } }, "+ Punkt hinzufügen"));
    }
    build();
    return box;
  }

  const FORMAT_HELP = "Auszeichnen im Text: <code>**fett**</code> <code>*kursiv*</code> "
    + "<code>[Linktext](https://…)</code>. Ein Zeilenumbruch im Feld ist auch auf der Seite einer. "
    + "Ein geleertes Feld zeigt wieder das Original.";
  const BLOCK_HELP = "Auszeichnen im Text: <code>## Zwischenüberschrift</code> <code>**fett**</code> "
    + "<code>[Linktext](mailto:…)</code>. Eine Leerzeile beginnt einen neuen Absatz.";

  function panel(title, sub, ...children) {
    return el("div", { class: "panel" }, el("h2", {}, title), sub ? el("p", { class: "sub" }, sub) : null, ...children);
  }

  // -------------------------------------------------------------- Fotos ---
  /**
   * Vor dem Hochladen verkleinern. Viele Fotos der Seite sind freigestellt –
   * deshalb bleibt die Transparenz erhalten, außer das Original ist ein JPEG.
   */
  async function prepareImage(file) {
    const img = await new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const i = new Image();
      i.onload = () => { URL.revokeObjectURL(url); resolve(i); };
      i.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Die Datei ist kein lesbares Bild.")); };
      i.src = url;
    });
    const opaque = file.type === "image/jpeg";
    for (const max of [2000, 1600, 1200, 900]) {
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = el("canvas");
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      // Safari kann kein WebP schreiben und liefert dann von selbst ein PNG.
      const blob = await new Promise((r) => canvas.toBlob(r, opaque ? "image/jpeg" : "image/webp", 0.85));
      if (!blob) throw new Error("Das Bild konnte nicht umgewandelt werden.");
      if (blob.size <= 4 * 1024 * 1024) return blob;
    }
    throw new Error("Das Bild ist auch verkleinert noch zu groß.");
  }

  async function uploadImage(key, file, status) {
    try {
      status.textContent = "Wird hochgeladen …";
      const blob = await prepareImage(file);
      const d = await api("/api/admin/media", { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
      state.content.images[key] = d.url;
      await save();
    } catch (err) {
      status.textContent = "";
      message("Foto hochladen fehlgeschlagen: " + err.message, "error");
    }
  }

  function renderImages(c) {
    const grid = el("div", { class: "img-grid" });
    for (const slot of state.schema.imageSlots) {
      const custom = state.content.images[slot.key];
      const status = el("div", { class: "hint" }, custom ? "Eigenes Foto" : "Originalfoto");
      const input = el("input", { type: "file", accept: "image/*", "aria-label": "Foto für " + slot.label });
      input.addEventListener("change", () => {
        if (input.files && input.files[0]) uploadImage(slot.key, input.files[0], status);
        input.value = "";
      });
      grid.append(el("div", { class: "img-card" },
        el("div", { class: "thumb" }, el("img", { src: custom || "/" + slot.default, alt: slot.label, loading: "lazy" })),
        el("div", { class: "body" },
          el("h3", {}, slot.label),
          el("div", { class: "hint note" }, slot.note),
          status, input,
          el("div", { class: "actions" },
            el("button", { class: "btn btn-ghost btn-small", type: "button", onclick: () => input.click() }, "Foto ersetzen"),
            custom ? el("button", { class: "btn btn-danger btn-small", type: "button", onclick: async () => {
              delete state.content.images[slot.key];
              await save();
            } }, "Original") : null,
          ),
        ),
      ));
    }
    c.append(panel("Fotos", "Foto auswählen: Es wird automatisch verkleinert, hochgeladen und sofort gespeichert.", grid));
  }

  // ------------------------------------------------------ Einstellungen ---
  function renderSettings(c) {
    const cur = el("input", { type: "password", autocomplete: "current-password", id: "pw-cur" });
    const pw1 = el("input", { type: "password", autocomplete: "new-password", id: "pw-new" });
    const pw2 = el("input", { type: "password", autocomplete: "new-password", id: "pw-new2" });
    const hint = el("div", { class: "hint" });
    const btn = el("button", { class: "btn btn-primary", type: "submit" }, "Passwort ändern");
    const form = el("form", { onsubmit: async (e) => {
      e.preventDefault();
      hint.textContent = "";
      if (pw1.value !== pw2.value) { hint.textContent = "Die beiden neuen Passwörter sind nicht gleich."; return; }
      btn.disabled = true;
      try {
        await api("/api/admin/password", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ current: cur.value, password: pw1.value }) });
        cur.value = pw1.value = pw2.value = "";
        message("Passwort geändert. Beim nächsten Mal gilt das neue.");
      } catch (err) { hint.textContent = err.message; } finally { btn.disabled = false; }
    } },
      el("div", { class: "field" }, el("label", { for: "pw-cur" }, "Bisheriges Passwort"), cur),
      el("div", { class: "field" }, el("label", { for: "pw-new" }, "Neues Passwort"), pw1),
      el("div", { class: "field" }, el("label", { for: "pw-new2" }, "Neues Passwort wiederholen"), pw2),
      hint, el("div", { style: "margin-top:12px" }, btn),
    );
    c.append(
      panel("Passwort ändern", "Gilt sofort. Mindestens 10 Zeichen.", form),
      panel("Aufräumen", "Nur bei Bedarf.",
        el("div", { style: "display:flex;gap:10px;flex-wrap:wrap" },
          el("button", { class: "btn btn-ghost btn-small", type: "button", onclick: async () => {
            if (!confirm("Alle hochgeladenen Fotos löschen, die gerade nirgends verwendet werden?")) return;
            try { const d = await api("/api/admin/cleanup", { method: "POST" }); message(d.removed + " ungenutzte Fotos gelöscht."); }
            catch (err) { message(err.message, "error"); }
          } }, "Ungenutzte Fotos löschen"),
          el("button", { class: "btn btn-danger btn-small", type: "button", onclick: () => {
            if (!confirm("Alle Texte auf das Original zurücksetzen? Erst mit „Speichern“ wird es wirksam. Fotos bleiben.")) return;
            state.content.texts = {};
            render();
            message("Texte zurückgesetzt, noch nicht gespeichert.");
          } }, "Alle Texte auf das Original"),
        ),
      ),
    );
  }

  // ------------------------------------------------------------ Aufbau ---
  function render() {
    const tabs = [...state.schema.tabs, { id: "fotos", label: "Fotos" }, { id: "einstellungen", label: "Einstellungen" }];
    const nav = $("tabs");
    nav.innerHTML = "";
    for (const t of tabs) {
      nav.append(el("button", { type: "button", class: t.id === state.tab ? "active" : "",
        onclick: () => { state.tab = t.id; render(); window.scrollTo({ top: 0 }); } }, t.label));
    }
    const c = $("panels");
    c.innerHTML = "";
    if (state.tab === "fotos") renderImages(c);
    else if (state.tab === "einstellungen") renderSettings(c);
    else {
      const panels = state.schema.panels.filter((p) => p.tab === state.tab);
      const hasBlock = panels.some((p) => p.fields.some((f) => f.type === "block"));
      c.append(el("div", { class: "fmt-help", html: hasBlock ? BLOCK_HELP : FORMAT_HELP }));
      for (const p of panels) {
        c.append(panel(p.title, p.sub, ...p.fields.map((f) => f.type === "list" ? listField(f) : textField(f))));
      }
    }
    markDirty();
  }

  $("save-btn").addEventListener("click", save);
  $("revert-btn").addEventListener("click", () => {
    if (!confirm("Alle Änderungen seit dem letzten Speichern verwerfen?")) return;
    state.content = clone(state.saved);
    render();
  });
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); if (state.dirty) save(); }
  });

  // ------------------------------------------------------------- Start ---
  function showLogin(msg) {
    $("app-view").classList.add("hidden");
    $("login-view").classList.remove("hidden");
    if (msg) { $("login-msg").textContent = msg; $("login-msg").classList.remove("hidden"); }
    $("pw").focus();
  }

  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("login-btn");
    btn.disabled = true; btn.textContent = "Prüfe …";
    $("login-msg").classList.add("hidden");
    try {
      await api("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: $("pw").value }) });
      $("pw").value = "";
      await start();
    } catch (err) {
      $("login-msg").textContent = err.message;
      $("login-msg").classList.remove("hidden");
    } finally { btn.disabled = false; btn.textContent = "Anmelden"; }
  });

  $("logout-btn").addEventListener("click", async () => {
    if (state.dirty && !confirm("Es gibt ungespeicherte Änderungen. Trotzdem abmelden?")) return;
    state.dirty = false;
    try { await fetch("/api/admin/logout", { method: "POST", credentials: "same-origin" }); } catch (e) {}
    location.reload();
  });

  async function readPage(path) {
    const res = await fetch(path);
    if (!res.ok) throw new Error(path + " nicht lesbar");
    return WortCms.readDefaults(new DOMParser().parseFromString(await res.text(), "text/html"));
  }

  async function start() {
    const session = await fetch("/api/admin/session", { credentials: "same-origin" }).then((r) => r.json()).catch(() => null);
    if (!session || !session.loggedIn) {
      showLogin(session && !session.configured ? "Es ist noch kein Passwort eingerichtet. In Netlify die Variable ADMIN_PASSWORD setzen." : null);
      return;
    }
    const [schema, content, home, thanks] = await Promise.all([
      api("/api/admin/schema"), api("/api/content"), readPage("/index.html"), readPage("/success.html"),
    ]);
    state.schema = schema;
    state.defaults = { texts: { ...home.texts, ...thanks.texts }, images: home.images };
    state.content = content.content;
    state.saved = clone(content.content);
    $("login-view").classList.add("hidden");
    $("app-view").classList.remove("hidden");
    render();
  }

  start().catch((err) => showLogin("Start fehlgeschlagen: " + err.message));
})();
</script>
</body>
</html>
